<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset Password - Alexa AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-box">
    <h2>Naya Password Set Karein</h2>
    <input type="password" id="rp-password" placeholder="Naya password (min 6 characters)" />
    <button onclick="resetPass()">Password Reset Karein</button>
    <p id="rp-message"></p>
  </div>

<script>
const API_BASE_URL = "https://alexa-ai-backend-bkah.onrender.com";

async function resetPass() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const email = params.get("email");
  const newPassword = document.getElementById("rp-password").value;
  const msg = document.getElementById("rp-message");

  if (!token || !email) { msg.textContent = "Invalid link."; return; }
  if (newPassword.length < 6) { msg.textContent = "Password kam se kam 6 characters ka ho."; return; }

  msg.textContent = "Reset kar rahe hain...";
  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, token, newPassword })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = "Password reset ho gaya! Ab login karein.";
      setTimeout(() => window.location.href = "login.html", 2000);
    } else {
      msg.textContent = data.error || "Kuch ghalat hua.";
    }
  } catch (err) {
    msg.textContent = "Server se connect nahi ho saka.";
  }
}
</script>
</body>
</html>
