<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Forgot Password - Alexa AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-box">
    <h2>Password Bhool Gaye?</h2>
    <p>Apna email daalein, hum reset link bhej dete hain.</p>
    <input type="email" id="fp-email" placeholder="Email" />
    <button onclick="sendReset()">Reset Link Bhejein</button>
    <p id="fp-message"></p>
    <a href="login.html">Login pe wapas jayein</a>
  </div>

<script>
const API_BASE_URL = "https://alexa-ai-backend-bkah.onrender.com";

async function sendReset() {
  const email = document.getElementById("fp-email").value.trim();
  const msg = document.getElementById("fp-message");
  if (!email) { msg.textContent = "Email daalein."; return; }

  msg.textContent = "Bhej rahe hain...";
  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    msg.textContent = data.message || "Ho gaya, apna email check karein.";
  } catch (err) {
    msg.textContent = "Kuch ghalat hua, dobara try karein.";
  }
}
</script>
</body>
</html>
